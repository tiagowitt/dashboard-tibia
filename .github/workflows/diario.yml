name: Coleta diária

on:
  schedule:
    # O GitHub não garante o horário dos agendamentos: em horário de pico atrasa ou pula.
    # Por isso há uma reserva; as duas só coletam o que ainda falta no dia (--so-faltantes).
    - cron: "30 9 * * *"    # 06:30 de Brasília (UTC−3, sem horário de verão) — principal
    - cron: "47 11 * * *"   # 08:47 de Brasília — reserva, se a principal não rodou ou falhou
  workflow_dispatch:         # botão "Run workflow" para rodar na mão
    inputs:
      forcar:
        description: "Coletar de novo mesmo se o dia já foi coletado (substitui os dados de hoje)"
        type: boolean
        default: false

permissions:
  contents: write           # só para commitar os dados com o GITHUB_TOKEN automático

# Diário e semanal nunca rodam ao mesmo tempo (os dois fazem commit).
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Se um conjunto falhar, os outros já foram gravados: segue para gerar e commitar
      # o que deu certo, e o job é marcado como falha no último passo.
      - name: Coletar highscore, kills e guilds
        id: coleta
        continue-on-error: true
        run: python -m coletor.coletar ${{ inputs.forcar && '' || '--so-faltantes' }}

      # Se o dia já estava completo (coletou=false), não há nada para gerar nem commitar.
      - name: Gerar agregados do dashboard
        id: agregados
        if: steps.coleta.outputs.coletou != 'false'
        continue-on-error: true
        run: python -m coletor.agregados

      # Mesmo se os agregados falharem, os Parquet coletados hoje precisam ser salvos.
      - name: Commitar dados
        id: commit
        if: ${{ !cancelled() && steps.coleta.outputs.coletou != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados site/dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Coleta $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
          echo "commitou=true" >> "$GITHUB_OUTPUT"

      # A Cloudflare às vezes falha ao publicar (aconteceu em 06/11/2026). Confere no site público
      # se os dados novos entraram no ar; se não, faz um commit de reenvio para ela tentar de novo.
      - name: Conferir se o site publicou
        if: ${{ !cancelled() && steps.commit.outputs.commitou == 'true' }}
        run: |
          for tentativa in 1 2 3; do
            if python -m coletor.publicacao; then exit 0; fi
            if [ "$tentativa" -eq 3 ]; then break; fi
            echo "Reenviando para a Cloudflare (tentativa $tentativa)..."
            echo "Reenvio $tentativa em $(date -u +%FT%TZ)" > site/dados/reenvio.txt
            git add site/dados/reenvio.txt
            git commit -m "Reenvio da publicação ($tentativa)"
            git pull --rebase
            git push
          done
          echo "::error::O site não publicou os dados novos depois de 2 reenvios. Veja os logs da Cloudflare Pages."
          exit 1

      - name: Acusar falhas
        if: steps.coleta.outcome == 'failure' || steps.agregados.outcome == 'failure'
        run: |
          echo "::error::Coleta: ${{ steps.coleta.outcome }} | Agregados: ${{ steps.agregados.outcome }}"
          exit 1
