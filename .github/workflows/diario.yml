name: Coleta diária

on:
  schedule:
    - cron: "30 9 * * *"   # 06:30 de Brasília (UTC−3, sem horário de verão)
  workflow_dispatch:        # botão "Run workflow" para rodar na mão

permissions:
  contents: write           # só para commitar os dados com o GITHUB_TOKEN automático

# Diário e semanal nunca rodam ao mesmo tempo (os dois fazem commit).
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      # Se um conjunto falhar, os outros já foram gravados: segue para gerar e commitar
      # o que deu certo, e o job é marcado como falha no último passo.
      - name: Coletar highscore, kills e guilds
        id: coleta
        continue-on-error: true
        run: python -m coletor.coletar

      - name: Gerar agregados do dashboard
        id: agregados
        continue-on-error: true
        run: python -m coletor.agregados

      # Mesmo se os agregados falharem, os Parquet coletados hoje precisam ser salvos.
      - name: Commitar dados
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados site/dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Coleta $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push

      - name: Acusar falhas
        if: steps.coleta.outcome == 'failure' || steps.agregados.outcome == 'failure'
        run: |
          echo "::error::Coleta: ${{ steps.coleta.outcome }} | Agregados: ${{ steps.agregados.outcome }}"
          exit 1
