name: Bosses (semanal)

on:
  schedule:
    - cron: "0 10 * * 1"   # segunda-feira, 07:00 de Brasília (depois da coleta diária)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  bosses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Atualizar lista de bosses
        run: python -m coletor.bosses

      # kills.json depende da lista de bosses.
      - name: Gerar agregados do dashboard
        run: python -m coletor.agregados

      - name: Commitar dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/bosses.json site/dados
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -m "Bosses $(TZ=America/Sao_Paulo date +%F)"
          git pull --rebase
          git push
