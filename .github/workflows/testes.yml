name: Testes

# Roda nos commits feitos por pessoas. Os commits do bot (GITHUB_TOKEN) não disparam workflows.
on:
  push:
    paths: ["coletor/**", "testes/**", "config.toml", "requirements.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt
      - run: python -m pytest -q
