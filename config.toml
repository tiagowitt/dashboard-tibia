# Configuração única do projeto Collabra XP.
# O coletor e os agregados leem daqui; nada disso deve ficar fixo no código.

[coleta]
paginas_highscore = 20          # 50 por página = top 1000
user_agent = "dashboard-tibia/1.0 (+https://github.com/tiagowitt/dashboard-tibia)"
timeout_segundos = 30
tentativas = 5                  # retry em 429/5xx com backoff exponencial

[regras]
dias_troca_de_dono = 10         # mais que isso sem aparecer no top = nova sessão
data_meta_anual = "12-31"       # dia/mês usado no cálculo "XP/dia até 31/12"

# Faixas de level para médias da guild: "2 - 199", "200 - 299" ... "1900 - 1999", "2000+"
[regras.faixas]
primeira_ate = 199
passo = 100
ultima_a_partir = 2000

# Mundos acompanhados. O primeiro é o padrão do site.
# Cada mundo tem suas guilds e a PT padrão da tela Análise PT (nome e meta de level).
# Os dados ficam em dados/<mundo>/ e site/dados/<mundo>/.

[[mundos]]
nome = "Collabra"
guilds = ["Digit One", "Digit One Academy"]

[[mundos.pt_padrao]]
nome = "Burtantan"
meta = 800

[[mundos.pt_padrao]]
nome = "Xar Lovinhu"
meta = 800

[[mundos.pt_padrao]]
nome = "Kelvin Klein"
meta = 900

[[mundos.pt_padrao]]
nome = "Parametro Arda"
meta = 900

[[mundos.pt_padrao]]
nome = "Neevez Relajado"
meta = 1000

[[mundos]]
nome = "Descubra"
guilds = ["Radioactive"]
pt_padrao = []                  # sem PT padrão: monte a PT na própria tela

[bosses]
categorias = ["Bane_Bosses", "Archfoe_Bosses", "Nemesis_Bosses"]

# Site publicado (usado para conferir se a Cloudflare publicou os dados novos)
[site]
url = "https://dashboard-tibia.pages.dev"
espera_minutos = 6              # quanto esperar a publicação antes de reenviar
