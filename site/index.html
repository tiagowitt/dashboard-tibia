<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Collabra XP</title>
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%234f97ec'/><stop offset='1' stop-color='%231c5cab'/></linearGradient></defs><rect width='32' height='32' rx='9' fill='url(%23g)'/><path d='M8 21.5l5.5-6 4 3.5L24 11' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preload" href="fontes/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar).
    try { const t = localStorage.getItem("tema"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <div class="topo-linha">
      <a class="marca" href="#ranking" aria-label="Collabra XP — início">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f97ec"/><stop offset="1" stop-color="#1c5cab"/></linearGradient></defs>
          <rect width="32" height="32" rx="9" fill="url(#logo-g)"/>
          <path d="M8 21.5l5.5-6 4 3.5L24 11" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Collabra XP
      </a>
      <nav class="abas" aria-label="Telas">
        <a href="#ranking" data-tela="ranking">Ranking</a>
        <a href="#jogador" data-tela="jogador">Jogador</a>
        <a href="#pt" data-tela="pt">Análise PT</a>
        <a href="#guild" data-tela="guild">Guild &amp; Kills</a>
      </nav>
      <div class="topo-acoes">
        <span class="pilula-data" id="info-data">carregando…</span>
        <button class="botao-icone" id="alternar-tema" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
          <svg class="icone-lua" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
          <svg class="icone-sol" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="conteudo" tabindex="-1"></main>

  <footer class="rodape">
    <span>Dados do mundo Collabra via TibiaData · atualizados todo dia às 06:30</span>
    <span id="rodape-gerado"></span>
  </footer>

  <script src="vendor/chart-4.5.1.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
